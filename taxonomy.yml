  in_diligence:          {label: "In Diligence",           aliases: ["In Diligence", "Diligence"]}
  term_sheet:            {label: "Term Sheet",             aliases: ["Term Sheet"]}
  closed:                {label: "Closed",                 aliases: ["Closed", "Funded"]}
  passed:                {label: "Passed",                 aliases: ["Not for us", "Pass", "Passed", "Declined"]}

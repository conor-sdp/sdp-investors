# SDP Investor Network Database — Taxonomy / Picklists
# Every value written to a categorical column in the SQLite DB must
# normalize to one of these slugs. Out-of-picklist values go to
# review_queue with a rapidfuzz-suggested mapping.
#
# Format: each picklist is a slug -> {label, aliases}.
# `label` is what we show in exports. `aliases` lists raw values seen
# in the source data that auto-resolve to this slug.

version: 1
last_updated: 2026-05-18

# ---------------------------------------------------------------------
# firm_type — what kind of capital-providing organization a firm is.
# Used by firms.type. Derived from "Firm Type" + "Entity Type" columns.
# ---------------------------------------------------------------------
firm_type:
  vc:                    {label: "Venture Capital",        aliases: ["VC", "Venture Capital"]}
  pe_firm:               {label: "Private Equity",         aliases: ["PE Firm", "Private Equity", "PE"]}
  growth_equity:         {label: "Growth Equity",          aliases: ["Growth/Expansion", "Growth Equity"]}
  infra_fund:            {label: "Infrastructure Fund",    aliases: ["Infra Fund", "Infra fund", "Infrastructure"]}
  family_office:         {label: "Family Office",          aliases: ["Family Office", "FO", "Multi-Family Office", "Single Family Office"]}
  lender:                {label: "Lender / Debt",          aliases: ["Lender", "Debt Fund", "Credit Fund", "Private Credit"]}
  pension_fund:          {label: "Pension Fund",           aliases: ["Pension Fund", "Pension"]}
  sovereign:             {label: "Sovereign Wealth Fund",  aliases: ["Sovereign", "SWF"]}
  insurance:             {label: "Insurance",              aliases: ["Insurance", "Insurance Company"]}
  hedge_fund:            {label: "Hedge Fund",             aliases: ["Hedge Fund", "HF"]}
  investment_bank:       {label: "Investment Bank",        aliases: ["Investment Bank", "IB", "Bank"]}
  angel_network:         {label: "Angel / Angel Network",  aliases: ["Angel Investment Network", "Angel", "Angel Network"]}
  corporate_vc:          {label: "Corporate VC",           aliases: ["CVC", "Corporate VC", "Corporate Venture"]}
  strategic:             {label: "Strategic / Corporate",  aliases: ["Strategic", "Corporate", "Industry Strategic"]}
  utility:               {label: "Utility",                aliases: ["Utility"]}
  incubator:             {label: "Incubator / Accelerator",aliases: ["Incubator", "Accelerator"]}
  sponsor:               {label: "Project Sponsor",        aliases: ["Sponsor"]}
  individual:            {label: "Individual",             aliases: ["Individual", "HNW", "Angel Individual"]}
  other:                 {label: "Other",                  aliases: ["Other", "Company", "Unknown"]}

